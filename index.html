<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, interactive-widget=resizes-content">
  <meta name="color-scheme" content="light">
  <title>Trọday - Quản lý thuê trọ</title>
  <link rel="stylesheet" href="styles.css?v=20261025-business-guide">
  <link rel="stylesheet" href="business-guide.css?v=20261025-business-guide">
  <script defer src="icons.js"></script>
  <script defer src="house-proof-store.js?v=20261025-house-verification"></script>
  <script defer src="house-rights.js?v=20261025-house-verification"></script>
  <script defer src="business-guide.js?v=20261025-business-guide"></script>
  <script defer src="app.js?v=20261025-business-guide"></script>
</head>
<body>
  <div class="app-shell">
    <aside class="sidebar" id="sidebar" aria-label="Dieu huong">
      <div class="brand"><span class="brand-mark">T</span><span>trọ<span class="brand-accent">day</span></span></div>
      <div id="sidebar-role"></div>
      <nav id="sidebar-nav" class="sidebar-nav" aria-label="Muc chinh"></nav>
      <div id="sidebar-account" class="sidebar-account"></div>
    </aside>
    <div class="workspace">
      <header class="topbar">
        <div class="topbar-location"><span class="crumb">Trọday</span><span class="crumb-divider">/</span><strong id="topbar-title">Khám phá phòng</strong></div>
        <div class="topbar-actions">
          <button type="button" class="icon-button notification-button" data-action="notifications" aria-label="Thông báo" title="Thông báo"><i data-lucide="bell"></i><span id="notification-count" class="notification-badge" aria-hidden="true" hidden></span></button>
          <div id="topbar-role-switch" class="role-switch" aria-label="Chuyển vai trò"></div>
          <button type="button" id="business-guide-tab" class="button business-guide-tab" data-action="business-guide" aria-pressed="false" aria-label="Logic nghiệp vụ" title="Xem tất cả luồng và ràng buộc nghiệp vụ"><i data-lucide="git-branch"></i><span>Logic nghiệp vụ</span></button>
        </div>
      </header>
      <main id="app-main" class="main-content" tabindex="-1"></main>
    </div>
  </div>
  <nav id="mobile-nav" class="mobile-nav" aria-label="Dieu huong di dong"></nav>
  <dialog id="app-dialog" class="app-dialog"><div id="dialog-body"></div></dialog>
  <div id="toast" class="toast" role="status" aria-live="polite"></div>
  <div id="notification-popups" class="notification-popups" popover="manual" role="region" aria-label="Thông báo mới" aria-live="polite" aria-relevant="additions"></div>
  <noscript>Trang này cần JavaScript để hiển thị giao diện.</noscript>
</body>
</html>
